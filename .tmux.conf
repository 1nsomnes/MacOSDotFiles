# =========================================================
# GENERAL SETTINGS
# =========================================================

# Change prefix from default (Ctrl+b) to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support (clicking panes, scrolling, resizing)
set -g mouse on

# Easy config reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# =========================================================
# PANE MANAGEMENT & SPLITS
# =========================================================

# Remove confirm for closing a pane
unbind-key x
bind-key x kill-pane

# Sane splits (opens in the same directory as the current pane)
# 'v' for side-by-side (vertical), 's' for top-to-bottom (horizontal)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# =========================================================
# PANE NAVIGATION & RESIZING (Vim-style)
# =========================================================

# Navigate panes using h, j, k, l
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes using Shift + H, J, K, L
# The -r flag makes it repeatable (e.g., Prefix -> hold Shift -> tap J multiple times)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================================================
# SESSION MANAGEMENT
# =========================================================

bind S choose-session

# =========================================================
# PLUGINS & THEMES
# =========================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# The Catppuccin Theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha' # Options: latte, frappe, macchiato, or mocha

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
